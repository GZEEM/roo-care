<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Roo Care">
<meta name="theme-color" content="#FFFDF6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>Roo Care</title>
<style>
/* All sizes are iPhone points, measured from Guy's screenshots (1125 x 2436, 3x). */
@font-face{font-family:"RooSans";src:url(fonts/Figtree.ttf) format("truetype");font-weight:300 900;font-display:block}
@font-face{font-family:"RooSerif";src:url(fonts/Newsreader.ttf) format("truetype");font-weight:200 800;font-display:block}
:root{
  --bg:#FFFDF6; --ink:#341C03; --ink2:#341C03; --sub:#785B4C; --grey:#785B4C; --cap:#818181; --plabel:#785B4C;
  --line:#ECE6D7; --tile:#F7F5EE; --blue:#5675AC; --red:#AD0F2C; --chev:#B8A89B; --off:#9E9890;
  --serif:"RooSerif", ui-serif, Georgia, serif;
  --sans:"RooSans", "Avenir Next", -apple-system, sans-serif;
  --top:env(safe-area-inset-top,0px); --bot:env(safe-area-inset-bottom,0px);
}
html.sim{--top:50px;--bot:34px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0}
html,body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-variant-numeric:proportional-nums;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;overscroll-behavior:none}
body{-webkit-user-select:none;user-select:none;overscroll-behavior-x:none}
button,a{touch-action:manipulation}
#app{position:relative;z-index:2;background:var(--bg);min-height:100vh}
#app.drag{box-shadow:-8px 0 24px rgba(52,28,3,.12)}
.under{position:fixed;inset:0;z-index:1;overflow:hidden;background:var(--bg);pointer-events:none}
.under:after{content:"";position:absolute;inset:0;background:rgba(52,28,3,.06)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
a{color:inherit;text-decoration:none}
svg{display:block}

/* tab-page header */
.hdr{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);height:calc(var(--top) + 60.4px)}
.hdr h1{position:absolute;left:16px;top:calc(var(--top) + 23px);font-family:var(--serif);font-weight:650;font-size:25.8px;line-height:32px;letter-spacing:-.1px;font-optical-sizing:auto}
.hdr .ri{position:absolute;right:23px;top:calc(var(--top) + 23.4px);width:26px;height:26px;display:grid;place-items:center}
.badge{position:absolute;left:15.5px;top:-4.5px;width:14.6px;height:14.6px;border-radius:50%;background:var(--red);color:#fff;font-size:9px;font-weight:600;display:grid;place-items:center;line-height:1}
/* list-page header (back + big title) */
.hdr.lst{height:calc(var(--top) + 100.2px)}
.hdr.lst h1{top:calc(var(--top) + 57px)}
.back{position:absolute;left:6px;top:calc(var(--top) + 1px);width:44px;height:44px;display:grid;place-items:center;z-index:3}
/* detail-page header */
.hdr.det{height:calc(var(--top) + 96.1px)}
.hdr.det .ttl{position:absolute;left:0;right:0;text-align:center;top:calc(var(--top) + 14.7px);font-size:16px;font-weight:500;line-height:20px;color:var(--ink2)}
.hdr.det .nm{position:absolute;left:16px;right:16px;top:calc(var(--top) + 61.6px);font-size:18.2px;font-weight:600;line-height:22px;color:var(--ink2)}

main{padding-bottom:calc(var(--bot) + 64px)}
.sec{padding:0 16px}
.sec.full{border-top:1px solid var(--line)}
.sec.inset{position:relative}
.sec.inset:before{content:"";position:absolute;left:16px;right:16px;top:0;border-top:1px solid var(--line)}
.h2{display:flex;justify-content:space-between;align-items:center;padding-top:17.8px;height:39.8px}
.h2 b{font-size:18.2px;font-weight:600;line-height:22px}
.h2 .lk{font-size:16px;font-weight:500;color:var(--blue);line-height:22px}

/* rows */
.row{display:flex;align-items:flex-start;width:100%;position:relative}
.row + .row:before,.row.ln:after{content:"";position:absolute;left:0;right:0;top:0;border-top:1px solid var(--line)}
.row.ln:after{top:auto;bottom:0}
.row .ic{width:24px;flex:0 0 24px;margin-right:12.8px;display:grid;place-items:center}
.row .av{width:40px;height:40px;flex:0 0 40px;border-radius:50%;margin-right:12.2px;overflow:hidden;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:15px;font-weight:600}
.row .av img{width:100%;height:100%;object-fit:cover}
.row .tx{flex:1;min-width:0}
.row .t{font-size:15.8px;font-weight:500;line-height:22px;color:var(--ink)}
.row .s{font-size:16px;line-height:19.9px;margin-top:1.2px;color:var(--sub)}
.row .s.g{color:var(--grey)}
.row .m{font-size:14px;line-height:19.9px;margin-top:2px;color:var(--ink)}
.row .ch{flex:0 0 14px;margin-left:8px;display:grid;place-items:center;height:22px;margin-right:2.5px}
/* two-line rows (Support, Settings, Care Plan) */
.r2{padding:14.2px 0 13px}
.r2 .ic{height:44px}
/* single-line rows (Records) */
.r1{padding:24.3px 0 22.4px;align-items:center}
/* avatar + one line (People, Pets) */
.ra{padding:14.5px 0 22.6px;align-items:center}
/* avatar + several lines (Home, Vaccinations) */
.rm{padding:14.6px 0 13.5px}
.rm .av{margin-top:.4px}
.rm.hm{padding-top:18.2px}
.rm .t.one{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rm .tx.nar{flex:0 0 246px}
.rm .tx.nar .t{white-space:nowrap}
.rm .tx.nar .s{max-width:231px}
.rm .sp{flex:1}

/* home */
.card{display:block;width:100%;position:relative;border:1.2px solid var(--line);border-radius:15.4px;background:var(--bg)}
.card.book{height:86.4px;margin-top:17.5px}
.card .ci{position:absolute;left:17px;top:17.4px}
.card .ct{position:absolute;left:17px;top:49.9px;font-size:15.9px;font-weight:500;line-height:22px}
.card .cc{position:absolute;right:20px;top:20.6px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin:13px 0 16.2px}
.tiles .card{height:87.3px}
.card.off{background:var(--tile);border-color:var(--tile)}
.card.off .ct{color:var(--off)}
.pill-up{position:absolute;left:80.4px;top:17.9px;width:67.8px;height:19.5px;border-radius:10px;background:var(--blue);color:#fff;font-size:12.1px;font-weight:500;display:grid;place-items:center}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:12.6px;margin:-2px 0 14.6px}
.act{height:54px;border-radius:12px;background:var(--tile);position:relative;display:block}
.act svg{position:absolute;left:50%;top:17.9px;transform:translate(-50%,-50%)}
.act span{position:absolute;left:0;right:0;top:30px;text-align:center;font-size:12px;font-weight:500;line-height:16px;color:var(--ink)}

/* detail pages */
.blk{position:relative;padding:0 16px}
.blk.inset:before{content:"";position:absolute;left:16px;right:16px;top:0;border-top:1px solid var(--line)}
.blk.full{border-top:1px solid var(--line)}
.pt{padding:13.6px 0 11.6px}
.pt .k{font-size:15.6px;line-height:19.9px;color:var(--plabel)}
.pt .v{font-weight:500;font-size:15.4px;line-height:19.9px;margin-top:4.1px;color:var(--ink2)}
.dh{padding-top:14.6px;font-size:18.2px;font-weight:600;line-height:22px;color:var(--ink2)}
.fl{padding:15.5px 0 11.6px;position:relative}
.fl + .fl:before{content:"";position:absolute;left:0;right:0;top:0;border-top:1px solid var(--line)}
.dh + .fl{padding-top:14.7px}
.fl:last-child{padding-bottom:24.2px}
.fl .k{font-size:13px;line-height:16px;letter-spacing:.2px;color:var(--cap);text-transform:uppercase}
.fl .v{font-size:16px;line-height:19.9px;margin-top:5.2px;color:var(--ink2)}
.dt{padding:15.05px 0 13.75px;font-size:16.5px;font-weight:500;line-height:19.9px;color:var(--ink2);position:relative}
.dt + .dt:before{content:"";position:absolute;left:0;right:0;top:0;border-top:1px solid var(--line)}
.dh + .dt{padding-top:16.8px}
.dt:last-child{padding-bottom:24.2px}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);height:calc(var(--bot) + 46.3px);padding:0 10px;display:grid;grid-template-columns:repeat(4,1fr);box-shadow:0 -3px 9px rgba(52,28,3,.035)}
.tab{position:relative;height:46.3px;color:var(--chev);text-align:center}
.tab svg{position:absolute;left:50%;top:19.1px;transform:translate(-50%,-50%);width:23px;height:23px}
.tab span{position:absolute;left:0;right:0;top:34.4px;font-size:9.9px;font-weight:500;line-height:14px}
.tab.on{color:var(--ink)}

/* sheets (only behind visible buttons: Book, Change) */
.scrim{position:fixed;inset:0;background:rgba(52,28,3,.3);z-index:20;display:flex;align-items:flex-end}
.sheet{background:var(--bg);width:100%;max-height:88vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px 16px calc(var(--bot) + 18px);-webkit-user-select:text;user-select:text}
.sheet h3{font-family:var(--serif);font-weight:500;font-size:24px;margin-bottom:8px}
.sheet label{display:block;font-size:12.9px;color:var(--cap);text-transform:uppercase;margin:12px 0 6px}
.sheet input{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
.btn{display:block;width:100%;height:47.5px;border-radius:11px;background:var(--blue);color:#fff;font-size:15.9px;font-weight:500;text-align:center;line-height:47.5px}
.btn.lt{background:var(--tile);color:var(--ink);margin-top:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--bot) + 60px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:30}
.empty{font-size:15.7px;color:var(--sub);padding:20px 0}
</style>
</head>

  followUps:[{id:'f1', team:'Manhattan Beach care team', text:"Questions about Roo's visit with Dr. Kristin Yang?", expires:'2026-11-13', initials:'KY', read:false}],
  care:[
    {id:'c1', name:'Intestinal Parasite Screening', kind:'lab', due:'2024-11-01'},
    {id:'c2', name:'Heartworm Testing', kind:'lab', due:'2025-11-01'},
    {id:'c3', name:'Routine Screening Labwork', kind:'lab', due:'2026-04-01'},
    {id:'c4', name:'Lepto', kind:'vax', due:'2026-05-25'},

  ],

  vaxInfo:VAX_INFO(),
  v:5
};
let S;
try{ S=JSON.parse(localStorage.getItem(KEY)) || structuredClone(SEED); }catch(e){ S=structuredClone(SEED); }
const save=()=>localStorage.setItem(KEY, JSON.stringify(S));
if(!S.v||S.v<5){ // earlier test versions: reset to the screenshot data, keep a changed photo
  const photo=S.pet&&S.pet.photo; S=structuredClone(SEED); if(photo) S.pet.photo=photo; save();
}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);

/* ---------- dates ---------- */
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const pd=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
function span(days){
  days=Math.abs(days);
  if(days>=365){const y=Math.floor(days/365);return `${y} year${y>1?'s':''}`}
  if(days>=30){const m=Math.max(1,Math.round(days/30.44));if(m>=12)return '1 year';return `${m} month${m>1?'s':''}`}
  if(days>=7){const w=Math.floor(days/7);return `${w} week${w>1?'s':''}`}
  return `${days} day${days===1?'':'s'}`;
}
const dayDiff=s=>Math.round((pd(s)-today())/864e5);
function careStatus(c){const d=dayDiff(c.due); if(d<0) return {due:true,text:`Overdue by ${span(d)}`}; if(d===0) return {due:true,text:'Due today'}; if(d<=30) return {due:true,text:`Due in ${span(d)}`}; return {due:false,text:`Due in ${span(d)}`}}
function ord(n){const s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0])}
function longWhen(w){const d=new Date(w);return `${d.toLocaleDateString('en-US',{weekday:'long'})}, ${d.toLocaleDateString('en-US',{month:'long'})} ${ord(d.getDate())} at ${d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})}`}
const mdy=s=>{const d=pd(s);return `${d.getMonth()+1}/${d.getDate()}/${String(d.getFullYear()).slice(2)}`};
const mdyFull=s=>{const d=pd(s);return `${d.getMonth()+1}/${d.getDate()}/${d.getFullYear()}`};
const longDate=s=>pd(s).toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});
const upcoming=()=>S.appointments.filter(a=>a.when&&new Date(a.when)>=new Date()).sort((a,b)=>a.when.localeCompare(b.when));
const liveFollowUps=()=>S.followUps.filter(f=>dayDiff(f.expires)>=0);
const tel=()=>S.clinic.phone.replace(/[^\d+]/g,'');
const mapsUrl=()=>'https://maps.apple.com/?daddr='+encodeURIComponent(S.clinic.address);
function initials(n){return (n||'').replace(/^(Dr\.?)\s+/i,'').split(/[ ,]+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join('')}
const petAv=()=>`<span class="av">${S.pet.photo?`<img src="${S.pet.photo}" alt="">`:''}</span>`;

/* ---------- shell ---------- */
let tab='home', stack=[];
const app=document.getElementById('app');
function hdr(title,right=''){return `<header class="hdr"><h1>${esc(title)}</h1>${right}</header>`}
function hdrList(title){return `<header class="hdr lst"><button class="back" onclick="pop()">${I.back}</button><h1>${esc(title)}</h1></header>`}
function hdrDet(ttl,name){return `<header class="hdr det"><button class="back" onclick="pop()">${I.back}</button><div class="ttl">${esc(ttl)}</div><div class="nm">${esc(name)}</div></header>`}
function bell(){const n=liveFollowUps().filter(f=>!f.read).length;return `<button class="ri" onclick="push('notes')">${I.bell}${n?`<span class="badge">${n}</span>`:''}</button>`}
function tabbar(){
  const t=(k,lab,ic)=>{const on=tab===k;return `<button class="tab ${on?'on':''}" onclick="go('${k}')">${I[ic].replace('SW',on?'2.3':'1.8')}<span>${lab}</span></button>`};
  return `<nav class="tabs">${t('home','Home','tHome')}${t('records','Records','tRec')}${t('care','Care Plan','tCare')}${t('account','Account','tAcct')}</nav>`;
}
function render(){const top=stack[stack.length-1];app.innerHTML=top?PAGES[top.p](top.a):VIEWS[tab]()+tabbar()} // inner pages have no tab bar, as in the screenshots
let tabY=0;
function go(k){tab=k;stack=[];render();scrollTo(0,0)}
function push(p,a){const cur=stack[stack.length-1];if(cur)cur.y=scrollY;else tabY=scrollY;stack.push({p,a});render();scrollTo(0,0)}
function pop(){if(!stack.length)return;stack.pop();render();const cur=stack[stack.length-1];scrollTo(0,cur?(cur.y||0):tabY)}
function prevHtml(){const s=stack.slice(0,-1),t=s[s.length-1];return t?PAGES[t.p](t.a):VIEWS[tab]()+tabbar()}

/* swipe from the left edge to go back, like a normal iPhone app */
let sw=null;
document.addEventListener('touchstart',e=>{
  if(!stack.length||document.querySelector('.scrim'))return;
  const t=e.touches[0]; if(t.clientX>30)return;
  sw={x:t.clientX,y:t.clientY,t:Date.now(),dx:0,lock:null,under:null};
},{passive:true});
document.addEventListener('touchmove',e=>{
  if(!sw)return; const t=e.touches[0], dx=t.clientX-sw.x, dy=t.clientY-sw.y;
  if(!sw.lock){ if(Math.abs(dx)>6&&Math.abs(dx)>Math.abs(dy)){sw.lock='h';
      const u=document.createElement('div');u.className='under';u.innerHTML=prevHtml();document.body.appendChild(u);sw.under=u;app.classList.add('drag');}
    else if(Math.abs(dy)>6){sw=null;return} }
  if(sw.lock==='h'){ e.preventDefault(); sw.dx=Math.max(0,dx); const w=innerWidth;
    app.style.transform=`translateX(${sw.dx}px)`; sw.under.style.transform=`translateX(${-w*0.3+sw.dx*0.3}px)`; }
},{passive:false});
document.addEventListener('touchend',()=>{
  if(!sw)return; const s=sw; sw=null; if(s.lock!=='h')return;
  const w=innerWidth, fast=s.dx/(Date.now()-s.t)>0.45, done=s.dx>w*0.33||(fast&&s.dx>40);
  const ease='transform .22s cubic-bezier(.2,.8,.2,1)';
  app.style.transition=ease; s.under.style.transition=ease;
  app.style.transform=`translateX(${done?w:0}px)`; s.under.style.transform=`translateX(${done?0:-w*0.3}px)`;
  setTimeout(()=>{app.style.transition='';app.style.transform='';app.classList.remove('drag');s.under.remove();if(done)pop();},230);
});
document.addEventListener('touchcancel',()=>{if(sw&&sw.under){sw.under.remove();app.style.transform='';app.classList.remove('drag')}sw=null});
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2000)}

/* row builders */
const r2=(ic,t,s,on,cls='')=>`<button class="row r2 ${cls}" onclick="${on}"><span class="ic">${ic}</span><span class="tx"><div class="t">${t}</div><div class="s">${s}</div></span><span class="ch">${ch}</span></button>`;
const r1=(ic,t,on)=>`<button class="row r1" onclick="${on}"><span class="ic">${ic}</span><span class="tx"><div class="t">${t}</div></span><span class="ch">${ch}</span></button>`;
const ra=(avh,t,on)=>`<button class="row ra" onclick="${on}">${avh}<span class="tx"><div class="t">${t}</div></span><span class="ch">${ch}</span></button>`;
const rm=(avh,t,s,m,on,{one=false,nar=false,sg=''}={})=>`<button class="row rm${nar?' hm':''}" onclick="${on}">${avh}<span class="tx ${nar?'nar':''}"><div class="t ${one?'one':''}">${t}</div>${s?`<div class="s ${sg}">${s}</div>`:''}${m?`<div class="m">${m}</div>`:''}</span>${nar?'<span class="sp"></span>':''}<span class="ch">${ch}</span></button>`;
const ini=x=>`<span class="av">${esc(x)}</span>`;
const h2=(t,lk='',on='')=>`<div class="h2"><b>${t}</b>${lk?`<button class="lk" onclick="${on}">${lk}</button>`:''}</div>`;

/* ---------- tab views ---------- */

  <div class="sec full"></div>
  </main>`;
 },

 },

 },

/* ---------- pushed pages ---------- */
const REC={summaries:['Care summaries','Care summary'],weights:['Weights','Weight'],labs:['Lab results','Lab result'],prescriptions:['Prescriptions','Prescription'],vaccinations:['Vaccinations','Vaccination'],estimates:['Estimates','Estimate'],invoices:['Invoices','Invoice']};
const recTitle=e=>e.product?`${e.title} (${e.product}${e.cut?'…':')'}`:(e.title||'');
const PAGES={
 rec(k){
  const key=e=>e.date||e.sort||'';
  const list=[...S.records[k]].sort((a,b)=>key(b).localeCompare(key(a)));
  const g={}; list.forEach(e=>{const y=(key(e)||'Undated').slice(0,4);(g[y]=g[y]||[]).push(e)});
  const body=Object.keys(g).sort().reverse().map((y,i)=>`<div class="sec${i?' full':''}" style="padding-bottom:4px">${h2(y)}${g[y].map(e=>rm(petAv(),esc(recTitle(e)),k==='vaccinations'?`Next due: ${e.next?mdy(e.next):''}`:(e.date?mdy(e.date):''),'',`push('recItem',['${k}','${e.id}'])`,{one:true,sg:'g'})).join('')}</div>`).join('');
  return hdrList(REC[k][0])+`<main>${body}</main>`;
 },
 recItem([k,id]){
  const e=S.records[k].find(x=>x.id===id);
  const fl=(lab,v)=>v?`<div class="fl"><div class="k">${lab}</div><div class="v">${v}</div></div>`:'';
  let det='', dates=[];
  if(k==='vaccinations'){
    const info=(S.vaxInfo||{})[e.title]||{}, same=S.records[k].filter(x=>x.title===e.title);
    const pick=f=>e[f]||(same.filter(x=>x[f]).sort((a,b)=>(b.date||b.sort).localeCompare(a.date||a.sort))[0]||{})[f]||'';
    det=fl('Description',esc(info.desc))+fl('Site',esc(pick('site')))+fl('Provider',esc(pick('provider')))+fl('Next due',(()=>{const n=same.filter(x=>x.next).sort((a,b)=>(b.date||'').localeCompare(a.date||''))[0];return n?longDate(n.next):''})()); // same details whichever row is opened
    dates=[...new Set([...(info.extra||[]),...same.map(x=>x.date).filter(Boolean)])].sort().map(mdyFull);
  }
  return hdrDet(`${REC[k][1]} details`,e.title)+`<main>
   <div class="blk"><div class="pt"><div class="k">Patient</div><div class="v">${esc(S.pet.name)}</div></div></div>
   <div class="blk inset"><div class="dh">Details</div>${det}</div>
   ${dates.length?`<div class="blk inset"><div class="dh">Administered on</div>${dates.map(d=>`<div class="dt">${d}</div>`).join('')}</div>`:''}
   <div class="blk full"></div></main>`;
 },
 appts(){
  const list=[...S.appointments].sort((a,b)=>(b.when||'').localeCompare(a.when||''));
  return hdrList('Appointments')+`<main><div class="sec">${list.map(a=>rm(ini(a.initials||initials(a.with)),esc(a.with),a.when?longWhen(a.when):'',`at ${esc(a.location)}`,`push('appt','${a.id}')`,{nar:true})).join('')}</div></main>`;
 },
 appt(id){
  const a=S.appointments.find(x=>x.id===id);
  return hdrDet('Appointment details',`${S.pet.name} and ${a.with}`)+`<main>
   <div class="blk"><div class="pt"><div class="k">Patient</div><div class="v">${esc(S.pet.name)}</div></div></div>
   <div class="blk inset"><div class="dh">Details</div>${a.when?`<div class="fl"><div class="k">When</div><div class="v">${longWhen(a.when)}</div></div>`:''}<div class="fl"><div class="k">Where</div><div class="v">${esc(a.location)}</div></div></div>
   <div class="blk full"></div></main>`;
 },
 care(id){
  const c=S.care.find(x=>x.id===id), st=careStatus(c);
  return hdrDet('Care plan details',c.name)+`<main>
   <div class="blk"><div class="pt"><div class="k">Patient</div><div class="v">${esc(S.pet.name)}</div></div></div>
   <div class="blk inset"><div class="dh">Details</div><div class="fl"><div class="k">Status</div><div class="v">${st.text}</div></div><div class="fl"><div class="k">Due</div><div class="v">${longDate(c.due)}</div></div></div>
   <div class="blk full"></div></main>`;
 },
 follow(id){

 member(){return hdrDet('Membership',S.membership)+`<main><div class="blk"><div class="pt"><div class="k">Plan</div><div class="v">${esc(S.membership)}</div></div></div><div class="blk full"></div></main>`}

/* ---------- sheets behind visible buttons (Book, Change) ---------- */
function sheet(inner){const s=document.createElement('div');s.className='scrim';s.innerHTML=`<div class="sheet">${inner}</div>`;s.onclick=e=>{if(e.target===s)s.remove()};document.body.appendChild(s)}
const closeSheet=()=>document.querySelector('.scrim')?.remove();
function apptSheet(id){
  const a=id?S.appointments.find(x=>x.id===id):{when:'',with:'',location:S.clinic.name};
  sheet(`<h3>${id?'Change visit':'Book an appointment'}</h3>
   ${id?'':`<a class="btn" href="tel:${tel()}" style="margin-bottom:6px">Call ${esc(S.clinic.phone)}</a>`}
   <label>Date and time</label><input id="aw" type="datetime-local" value="${a.when}">
   <label>With</label><input id="ah" value="${esc(a.with)}">
   <label>Where</label><input id="al" value="${esc(a.location)}">
   <button class="btn lt" onclick="saveAppt('${id||''}')">Save</button>`);
}
function saveAppt(id){
  const v={when:aw.value,with:ah.value||'Care team',location:al.value||S.clinic.name};v.initials=initials(v.with);
  if(id) Object.assign(S.appointments.find(x=>x.id===id),v); else S.appointments.push({id:uid(),...v});
  save();closeSheet();render();
}
function addToCal(id){
  const a=S.appointments.find(x=>x.id===id); if(!a.when) return;
  const s=new Date(a.when), e=new Date(s.getTime()+3600e3), f=d=>d.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');
  const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Roo Care//EN','BEGIN:VEVENT',`UID:${a.id}@roocare`,`DTSTAMP:${f(new Date())}`,`DTSTART:${f(s)}`,`DTEND:${f(e)}`,`SUMMARY:${S.pet.name} and ${a.with}`,`LOCATION:${S.clinic.address.replace(/,/g,'\\,')}`,'END:VEVENT','END:VCALENDAR'].join('\r\n');
  location.href='data:text/calendar;charset=utf-8,'+encodeURIComponent(ics);
}
function exportData(){
  const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}), name=`roo-records-${new Date().toISOString().slice(0,10)}.json`;
  const f=new File([blob],name,{type:'application/json'});
  if(navigator.canShare&&navigator.canShare({files:[f]})) navigator.share({files:[f]}).catch(()=>{});
  else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click()}
}

{const h=location.hash.slice(1).split(':'); if(VIEWS[h[0]]) tab=h[0];
